name: Swiftテスト

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: ソースを取得
        uses: actions/checkout@v7

      - name: 100 MB以上の追跡ファイルを検査
        shell: bash
        run: |
          set -euo pipefail
          oversized="$({
            git ls-files -z |
              xargs -0 stat -f '%z %N' |
              awk '$1 >= 100000000'
          } || true)"
          if [[ -n "$oversized" ]]; then
            echo "GitHubの上限を超える追跡ファイルがあります:"
            echo "$oversized"
            exit 1
          fi

      - name: ビルドツールを準備
        shell: bash
        run: |
          # macOSランナーに残る未信頼の外部tapを外し、Homebrewの警告を防ぐ。
          brew untap aws/tap 2>/dev/null || true
          brew install cmake ninja

      - name: 最低対応OSを取得
        id: target
        shell: bash
        run: |
          echo "version=$(sed -n 's/^let deploymentTarget = "\(.*\)"$/\1/p' MacStarStacker.swiftpm/Package.swift)" >> "$GITHUB_OUTPUT"

      # OpenCV・LibRawのビルドには時間がかかるため、スクリプトと最低対応OSが変わらない限りキャッシュを使う
      - name: 依存ライブラリのキャッシュを復元
        uses: actions/cache@v5
        with:
          path: MacStarStacker.swiftpm/Vendor
          key: vendor-${{ runner.os }}-macos${{ steps.target.outputs.version }}-${{ hashFiles('scripts/build_deps.sh') }}

      - name: OpenCVとLibRawをビルド
        run: bash scripts/build_deps.sh "${{ steps.target.outputs.version }}"

      - name: 全テストを実行
        run: swift test --package-path MacStarStacker.swiftpm
